          if any(not field.replace("_", "").isalnum() for field in fields):
              raise SystemExit("Virheellinen kenttänimi")
          for key, template, title, note, unit, frequency, url in new_series:
              field_list = ",".join('"' + field + '"' for field in fields)
              existing = query(f"SELECT {field_list} FROM {metadata} WHERE series_key=?", [template])["rows"]
              if len(existing) != 1:
                  raise SystemExit(f"Pohjasarjaa ei löytynyt: {template}")
              record = {field: cell.get("value") for field, cell in zip(fields, existing[0])}
              record.update(series_key=key, title=title, _migration_key="pitka-aikasarja:"+key,
                            source_url=url, unit=unit, frequency=frequency,
                            source=url, source_name="OWID" if key.startswith("owid.") else "WID / Statistics Finland",
                            description=note, notes=note, meta=json.dumps({"source":url,"definition":note}))
              values = [record.get(field) for field in fields]
              placeholders = ",".join("NULL" if value is None else "?" for value in values)
              query(f"INSERT INTO {metadata} ({field_list}) VALUES ({placeholders}) ON CONFLICT(series_key) DO NOTHING",
                    [value for value in values if value is not None])
              check = query(f"SELECT title FROM {metadata} WHERE series_key=?", [key])["rows"]
              if len(check) != 1 or check[0][0]["value"] != title:
                  raise SystemExit(f"Sarjan metatiedot eivät täsmää: {key}")
          table = "public__indicator_values"
          for key in {row[0] for row in batch if row[1] == "AUTO"}:
              groups = query(f"SELECT DISTINCT group_key FROM {table} WHERE series_key=? AND year=? AND value IS NOT NULL", [key, min(row[2] for row in batch if row[0] == key)-1])["rows"]
              if len(groups) != 1:
                  raise SystemExit(f"Yksiselitteistä ryhmää ei löytynyt: {key}")
              for row in batch:
                  if row[0] == key:
                      row[1] = groups[0][0]["value"]
          columns = "series_key,group_key,year,value,value_kind,source_url,validation_note,_migration_key"
          parameter_group = "(" + ",".join("?" for _ in range(8)) + ")"
          payload = ",".join(parameter_group for _ in batch)
          args = [v for row in batch for v in (*row, f"owid-wid-pitkat-20261126:{row[0]}:{row[1]}:{row[2]}")]
          keys = [(r[0], r[1], r[2]) for r in batch]
          predicate = "(series_key,group_key,year) IN (" + ",".join("(?,?,?)" for _ in keys) + ")"
          key_args = [v for key in keys for v in key]
          
          def read_back():
              result = query(f"SELECT {columns} FROM {table} WHERE {predicate}", key_args)
              return {(key, group, int(year)): (value, kind, url) for key, group, year, value, kind, url, *_ in
                      ([c.get("value") for c in row] for row in result["rows"])}
          
          before = read_back()
          for key, group, year, value, kind, url, _ in batch:
              existing = before.get((key, group, year))
              if existing and existing[0] is not None and existing[1] != "projection":
                  if float(existing[0]) != float(value) or existing[1:] != (kind, url):
                      raise SystemExit(f"Ristiriita olemassa olevassa havainnossa: {key}, {year}")
          
          sql = f"""
          INSERT INTO {table} ({columns},is_published,imported_at,meta)
          SELECT series_key,group_key,year,value,value_kind,source_url,validation_note,_migration_key,
                 1,datetime('now'),json_object('import_batch','owid-wid-pitkat-20261126')
          FROM (WITH batch({columns}) AS (VALUES {payload}) SELECT * FROM batch)
          WHERE true
          ON CONFLICT(series_key,year,group_key) DO UPDATE SET
              value=excluded.value,
              value_kind=excluded.value_kind,
              source_url=excluded.source_url,
              validation_note=excluded.validation_note,
              is_published=excluded.is_published,
              imported_at=excluded.imported_at,
              meta=json_object('import_batch','owid-wid-pitkat-20261126','previous_meta',meta,
                  'previous_value',value,'previous_value_kind',value_kind,'previous_source_url',source_url,
                  'previous_source_version',source_version,'previous_source_retrieved_at',source_retrieved_at),
              source_version=NULL,
              source_retrieved_at=NULL,
              value_text=NULL
          WHERE public__indicator_values.value_kind='projection' OR public__indicator_values.value IS NULL
          """
          result = query(sql, args)
          stored = read_back()
          for key, group, year, value, kind, url, _ in batch:
              actual = stored.get((key, group, year))
              if not actual or float(actual[0]) != float(value) or actual[1:] != (kind, url):
                  raise SystemExit(f"Takaisinluku poikkeaa: {key}, {year}")
          message = f"Varmistettu Turson takaisinluvulla: {len(stored)}/{len(batch)}. Muuttuneita rivejä: {result['affected_row_count']}."
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(message, file=summary)
          PY
