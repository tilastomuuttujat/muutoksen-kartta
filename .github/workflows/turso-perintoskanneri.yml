name: Skannerin koko Turso-vienti
on:
  push:
    branches: [turso-perintoskanneri-20261126]
    paths: [.github/workflows/turso-perintoskanneri.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f832947891e0d8fbd9b0de237d21c3bdffccf66d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Vie lähdeaineisto Tursosta
        env:
          TURSO_TOKEN: ${{ secrets.TURSO_WRITE_TOKEN }}
        run: |
          test -n "$TURSO_TOKEN"
          python scripts/skannauskoe/fetch.py
      - name: Muodosta ja tarkista scanner.json
        run: |
          python scripts/skannauskoe/build-scanner.py
          python - <<'PY'
          import json, math
          from pathlib import Path
          data = json.loads(Path("src/data/scanner.json").read_text())
          series = {s["k"]:s for s in data["series"]}
          supplement = json.loads(Path("src/data/perinto-turso.json").read_text())
          for item in supplement["series"]:
              s = series[item["key"]]
              for year, expected in enumerate(item["values"],item["from"]):
                  offset = year-s["y0"]
                  assert 0 <= offset < len(s["v"]), (item["key"],year)
                  observed = s["v"][offset]
                  assert observed is not None and math.isclose(observed,float(f"{expected:.4g}"),abs_tol=1e-10), (item["key"],year,observed,expected)
          print(f"Varmistettu {len(series)} sarjaa ja kaikki 142 täydennystä.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-turso
          path: src/data/scanner.json
          if-no-files-found: error
