name: Turso – tuo Perintöskannerin vuosiarvot
on:
  push:
    branches: [turso-perintoskanneri-20261126]
permissions: {}
jobs:
  import:
    runs-on: ubuntu-latest
    env:
      TURSO_TOKEN: ${{ secrets.TURSO_WRITE_TOKEN }}
    steps:
      - name: Tuo ja varmista kuusi rikoshavaintoa
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          
          endpoint = "https://murrosmatriisi-tilastomuuttujat.aws-eu-north-1.turso.io/v2/pipeline"
          token = os.environ.get("TURSO_TOKEN")
          if not token:
              raise SystemExit("TURSO_WRITE_TOKEN puuttuu")
          
          batch = json.loads(r'''[["crime.hcs.fi.police_manslaughter","AUTO",2023,"38","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/rpk/13gw.px","Tapot, StatFin 13gw, poliisi (1), rikosnimike 210101. Vuodet 2020–2022 vastaavat historiallista koostetta; vanhemmissa päällekkäisissä vuosissa on eroja."],["crime.hcs.fi.police_manslaughter","AUTO",2024,"53","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/rpk/13gw.px","Tapot, StatFin 13gw, poliisi (1), rikosnimike 210101. Vuodet 2020–2022 vastaavat historiallista koostetta; vanhemmissa päällekkäisissä vuosissa on eroja."],["crime.hcs.fi.police_manslaughter","AUTO",2025,"56","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/rpk/13gw.px","Tapot, StatFin 13gw, poliisi (1), rikosnimike 210101. Vuodet 2020–2022 vastaavat historiallista koostetta; vanhemmissa päällekkäisissä vuosissa on eroja."],["crime.hcs.fi.police_murder","AUTO",2023,"19","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/rpk/13gw.px","Murhat, StatFin 13gw, poliisi (1), rikosnimike 210201. Vuodet 2020–2022 vastaavat historiallista koostetta; vanhemmissa päällekkäisissä vuosissa on eroja."],["crime.hcs.fi.police_murder","AUTO",2024,"36","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/rpk/13gw.px","Murhat, StatFin 13gw, poliisi (1), rikosnimike 210201. Vuodet 2020–2022 vastaavat historiallista koostetta; vanhemmissa päällekkäisissä vuosissa on eroja."],["crime.hcs.fi.police_murder","AUTO",2025,"24","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/rpk/13gw.px","Murhat, StatFin 13gw, poliisi (1), rikosnimike 210201. Vuodet 2020–2022 vastaavat historiallista koostetta; vanhemmissa päällekkäisissä vuosissa on eroja."]]''')
          
          def query(sql, args=()):
              typed = [{"type": "integer" if isinstance(v, int) else "text", "value": str(v)} for v in args]
              requests = [{"type": "execute", "stmt": {"sql": sql, "args": typed}}, {"type": "close"}]
              request = urllib.request.Request(endpoint, data=json.dumps({"requests": requests}).encode(),
                  headers={"Content-Type": "application/json", "Authorization": "Bearer " + token})
              with urllib.request.urlopen(request, timeout=40) as response:
                  item = json.load(response)["results"][0]
              if item["type"] != "ok":
                  raise RuntimeError(item["error"]["message"])
              return item["response"]["result"]
          
          table = "public__indicator_values"
          for key in {row[0] for row in batch}:
              groups = query(f"SELECT DISTINCT group_key FROM {table} WHERE series_key=? AND year=2022 AND value IS NOT NULL", [key])["rows"]
              if len(groups) != 1:
                  raise SystemExit(f"Yksiselitteistä ryhmää ei löytynyt: {key}")
              for row in batch:
                  if row[0] == key:
                      row[1] = groups[0][0]["value"]
          columns = "series_key,group_key,year,value,value_kind,source_url,validation_note,_migration_key"
          parameter_group = "(" + ",".join("?" for _ in range(8)) + ")"
          payload = ",".join(parameter_group for _ in batch)
          args = [v for row in batch for v in (*row, f"statfin-rikokset-20261126:{row[0]}:{row[1]}:{row[2]}")]
          keys = [(r[0], r[1], r[2]) for r in batch]
          predicate = "(series_key,group_key,year) IN (" + ",".join("(?,?,?)" for _ in keys) + ")"
          key_args = [v for key in keys for v in key]
          
          def read_back():
              result = query(f"SELECT {columns} FROM {table} WHERE {predicate}", key_args)
              return {(key, group, int(year)): (value, kind, url) for key, group, year, value, kind, url, *_ in
                      ([c.get("value") for c in row] for row in result["rows"])}
          
          before = read_back()
          for key, group, year, value, kind, url, _ in batch:
              existing = before.get((key, group, year))
              if existing and existing[0] is not None and existing[1] != "projection":
                  if float(existing[0]) != float(value) or existing[1:] != (kind, url):
                      raise SystemExit(f"Ristiriita olemassa olevassa havainnossa: {key}, {year}")
          
          sql = f"""
          INSERT INTO {table} ({columns},is_published,imported_at,meta)
          SELECT series_key,group_key,year,value,value_kind,source_url,validation_note,_migration_key,
                 1,datetime('now'),json_object('import_batch','rikokset-statfin-20261126')
          FROM (WITH batch({columns}) AS (VALUES {payload}) SELECT * FROM batch)
          WHERE true
          ON CONFLICT(series_key,year,group_key) DO UPDATE SET
              value=excluded.value,
              value_kind=excluded.value_kind,
              source_url=excluded.source_url,
              validation_note=excluded.validation_note,
              is_published=excluded.is_published,
              imported_at=excluded.imported_at,
              meta=json_object('import_batch','rikokset-statfin-20261126','previous_meta',meta,
                  'previous_value',value,'previous_value_kind',value_kind,'previous_source_url',source_url,
                  'previous_source_version',source_version,'previous_source_retrieved_at',source_retrieved_at),
              source_version=NULL,
              source_retrieved_at=NULL,
              value_text=NULL
          WHERE public__indicator_values.value_kind='projection' OR public__indicator_values.value IS NULL
          """
          result = query(sql, args)
          stored = read_back()
          for key, group, year, value, kind, url, _ in batch:
              actual = stored.get((key, group, year))
              if not actual or float(actual[0]) != float(value) or actual[1:] != (kind, url):
                  raise SystemExit(f"Takaisinluku poikkeaa: {key}, {year}")
          message = f"Varmistettu Turson takaisinluvulla: {len(stored)}/{len(batch)}. Muuttuneita rivejä: {result['affected_row_count']}."
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(message, file=summary)
          PY
