name: Skannerin koko Turso-vienti
on:
  push:
    branches: [turso-perintoskanneri-20261126]
    paths: [.github/workflows/turso-perintoskanneri.yml]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perinto-pitkat-sarjat-20261126
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Vie lähdeaineisto Tursosta
        env:
          TURSO_TOKEN: ${{ secrets.TURSO_WRITE_TOKEN }}
        run: |
          test -n "$TURSO_TOKEN"
          python scripts/skannauskoe/fetch.py
      - name: Muodosta ja tarkista scanner.json
        run: |
          python scripts/skannauskoe/build-scanner.py
          python - <<'PY'
          import json, math
          from pathlib import Path
          data = json.loads(Path("src/data/scanner.json").read_text())
          series = {s["k"]:s for s in data["series"]}
          supplement = json.loads(Path("src/data/perinto-turso.json").read_text())
          for item in supplement["series"]:
              s = series[item["key"]]
              for year, expected in enumerate(item["values"],item["from"]):
                  offset = year-s["y0"]
                  assert 0 <= offset < len(s["v"]), (item["key"],year)
                  observed = s["v"][offset]
                  assert observed is not None and math.isclose(observed,float(f"{expected:.4g}"),abs_tol=1e-10), (item["key"],year,observed,expected)
          expected = {
              "owid.finland.mean_years_schooling_15_64": (1870, 2020, 31),
              "owid.finland.annual_working_hours_per_worker": (1950, 2023, 74),
              "wid.finland.top1_taxable_income_population_1920_1992": (1920, 1992, 73),
              "wid.finland.top1_income_subject_to_tax_adults_1949_2003": (1949, 2003, 55),
          }
          for key, (start, end, size) in expected.items():
              item = series[key]
              assert (item["y0"],item["y0"]+len(item["v"])-1,sum(v is not None for v in item["v"])) == (start,end,size), key
          education = series["owid.finland.mean_years_schooling_15_64"]
          assert education["sparse"] and set(education["f"]) == {"."}
          print("Neljä uutta sarjaa ja 233 havaintopistettä varmistettu.")
          print(f"Varmistettu {len(series)} sarjaa ja kaikki 142 täydennystä.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-turso
          path: src/data/scanner.json
          if-no-files-found: error
      - name: Päivitä aineisto julkaisuhaaraan
        run: |
          cp src/data/scanner.json "$RUNNER_TEMP/scanner-turso.json"
          git restore src/data/scanner.json
          git fetch origin perinto-pitkat-sarjat-20261126
          git checkout --detach FETCH_HEAD
          cp "$RUNNER_TEMP/scanner-turso.json" src/data/scanner.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/scanner.json
          if ! git diff --cached --quiet; then
            git commit -m "Päivitä skannerin julkaisuaneisto Tursosta"
            git push origin HEAD:refs/heads/perinto-pitkat-sarjat-20261126
          fi
