name: Turso – tuo Perintöskannerin vuosiarvot
on:
  push:
    branches: [turso-perintoskanneri-20261126]
permissions: {}
jobs:
  import:
    runs-on: ubuntu-latest
    env:
      TURSO_TOKEN: ${{ secrets.TURSO_WRITE_TOKEN }}
    steps:
      - name: Tuo ja varmista 20 vuosiarvoa
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          
          endpoint = "https://murrosmatriisi-tilastomuuttujat.aws-eu-north-1.turso.io/v2/pipeline"
          token = os.environ.get("TURSO_TOKEN")
          if not token:
              raise SystemExit("TURSO_WRITE_TOKEN puuttuu")
          
          batch = json.loads(r'''[["gapminder.finland.children_per_woman_total_fertility.v20261026","FI",2024,"1.25","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/synt/12dt.px","Kokonaishedelmällisyysluku, Tilastokeskus."],["gapminder.finland.children_per_woman_total_fertility.v20261026","FI",2025,"1.3","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/synt/12dt.px","Kokonaishedelmällisyysluku, Tilastokeskus."],["fi.histlabour.lfs2019.employment_rate","FI_HIST",2019,"71.6","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tyti/13aj.px","Työllisyysaste, 15–64-vuotiaat, työvoimatutkimuksen tarkistetut luvut."],["fi.histlabour.lfs2019.employment_rate","FI_HIST",2020,"70.7","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tyti/13aj.px","Työllisyysaste, 15–64-vuotiaat, työvoimatutkimuksen tarkistetut luvut."],["fi.histlabour.lfs2019.employment_rate","FI_HIST",2021,"72.3","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tyti/13aj.px","Työllisyysaste, 15–64-vuotiaat, työvoimatutkimuksen tarkistetut luvut."],["fi.histlabour.lfs2019.employment_rate","FI_HIST",2022,"73.8","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tyti/13aj.px","Työllisyysaste, 15–64-vuotiaat, työvoimatutkimuksen tarkistetut luvut."],["fi.histlabour.lfs2019.employment_rate","FI_HIST",2023,"73.6","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tyti/13aj.px","Työllisyysaste, 15–64-vuotiaat, työvoimatutkimuksen tarkistetut luvut."],["fi.histlabour.lfs2019.employment_rate","FI_HIST",2024,"72.1","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tyti/13aj.px","Työllisyysaste, 15–64-vuotiaat, työvoimatutkimuksen tarkistetut luvut."],["fi.histlabour.lfs2019.employment_rate","FI_HIST",2025,"71.4","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tyti/13aj.px","Työllisyysaste, 15–64-vuotiaat, työvoimatutkimuksen tarkistetut luvut."],["fi.historical20261026.jst.real_wage_index","FI",2021,"136.384","estimate","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/ati/14un.px","Historiallinen JST R6 -sarja jatkettu Tilastokeskuksen reaaliansioindeksin vuosimuutoksilla, 2020 ankkurivuotena."],["fi.historical20261026.jst.real_wage_index","FI",2022,"130.46","estimate","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/ati/14un.px","Historiallinen JST R6 -sarja jatkettu Tilastokeskuksen reaaliansioindeksin vuosimuutoksilla, 2020 ankkurivuotena."],["fi.historical20261026.jst.real_wage_index","FI",2023,"127.827","estimate","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/ati/14un.px","Historiallinen JST R6 -sarja jatkettu Tilastokeskuksen reaaliansioindeksin vuosimuutoksilla, 2020 ankkurivuotena."],["fi.historical20261026.jst.real_wage_index","FI",2024,"130.197","estimate","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/ati/14un.px","Historiallinen JST R6 -sarja jatkettu Tilastokeskuksen reaaliansioindeksin vuosimuutoksilla, 2020 ankkurivuotena."],["fi.historical20261026.jst.real_wage_index","FI",2025,"133.619","estimate","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/ati/14un.px","Historiallinen JST R6 -sarja jatkettu Tilastokeskuksen reaaliansioindeksin vuosimuutoksilla, 2020 ankkurivuotena."],["fi.distribution.gini2020.disposable","FI_REGISTER",2019,"27.9","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tjt/11x3.px","Gini, käytettävissä olevat rahatulot, rekisteriaineisto."],["fi.distribution.gini2020.disposable","FI_REGISTER",2020,"27.7","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tjt/11x3.px","Gini, käytettävissä olevat rahatulot, rekisteriaineisto."],["fi.distribution.gini2020.disposable","FI_REGISTER",2021,"29.1","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tjt/11x3.px","Gini, käytettävissä olevat rahatulot, rekisteriaineisto."],["fi.distribution.gini2020.disposable","FI_REGISTER",2022,"28.6","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tjt/11x3.px","Gini, käytettävissä olevat rahatulot, rekisteriaineisto."],["fi.distribution.gini2020.disposable","FI_REGISTER",2023,"27.9","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tjt/11x3.px","Gini, käytettävissä olevat rahatulot, rekisteriaineisto."],["fi.distribution.gini2020.disposable","FI_REGISTER",2024,"28.4","observed","https://pxdata.stat.fi/PxWeb/api/v1/fi/StatFin/tjt/11x3.px","Gini, käytettävissä olevat rahatulot, rekisteriaineisto."]]''')
          
          def query(sql, args=()):
              typed = [{"type": "integer" if isinstance(v, int) else "text", "value": str(v)} for v in args]
              requests = [{"type": "execute", "stmt": {"sql": sql, "args": typed}}, {"type": "close"}]
              request = urllib.request.Request(endpoint, data=json.dumps({"requests": requests}).encode(),
                  headers={"Content-Type": "application/json", "Authorization": "Bearer " + token})
              with urllib.request.urlopen(request, timeout=40) as response:
                  item = json.load(response)["results"][0]
              if item["type"] != "ok":
                  raise RuntimeError(item["error"]["message"])
              return item["response"]["result"]
          
          table = "public__indicator_values"
          columns = "series_key,group_key,year,value,value_kind,source_url,validation_note,_migration_key"
          parameter_group = "(" + ",".join("?" for _ in range(8)) + ")"
          payload = ",".join(parameter_group for _ in batch)
          args = [v for row in batch for v in (*row, f"statfin-perinto-20261126:{row[0]}:{row[1]}:{row[2]}")]
          keys = [(r[0], r[1], r[2]) for r in batch]
          predicate = "(series_key,group_key,year) IN (" + ",".join("(?,?,?)" for _ in keys) + ")"
          key_args = [v for key in keys for v in key]
          
          def read_back():
              result = query(f"SELECT {columns} FROM {table} WHERE {predicate}", key_args)
              return {(key, group, int(year)): (value, kind, url) for key, group, year, value, kind, url, *_ in
                      ([c.get("value") for c in row] for row in result["rows"])}
          
          before = read_back()
          for key, group, year, value, kind, url, _ in batch:
              existing = before.get((key, group, year))
              if existing and existing[0] is not None and existing[1] != "projection":
                  if float(existing[0]) != float(value) or existing[1:] != (kind, url):
                      raise SystemExit(f"Ristiriita olemassa olevassa havainnossa: {key}, {year}")
          
          sql = f"""
          INSERT INTO {table} ({columns},is_published,imported_at,meta)
          SELECT series_key,group_key,year,value,value_kind,source_url,validation_note,_migration_key,
                 1,datetime('now'),json_object('import_batch','perinto-statfin-20261126')
          FROM (WITH batch({columns}) AS (VALUES {payload}) SELECT * FROM batch)
          WHERE true
          ON CONFLICT(series_key,year,group_key) DO UPDATE SET
              value=excluded.value,
              value_kind=excluded.value_kind,
              source_url=excluded.source_url,
              validation_note=excluded.validation_note,
              is_published=excluded.is_published,
              imported_at=excluded.imported_at,
              meta=json_object('import_batch','perinto-statfin-20261126','previous_meta',meta,
                  'previous_value',value,'previous_value_kind',value_kind,'previous_source_url',source_url,
                  'previous_source_version',source_version,'previous_source_retrieved_at',source_retrieved_at),
              source_version=NULL,
              source_retrieved_at=NULL,
              value_text=NULL
          WHERE public__indicator_values.value_kind='projection' OR public__indicator_values.value IS NULL
          """
          result = query(sql, args)
          stored = read_back()
          for key, group, year, value, kind, url, _ in batch:
              actual = stored.get((key, group, year))
              if not actual or float(actual[0]) != float(value) or actual[1:] != (kind, url):
                  raise SystemExit(f"Takaisinluku poikkeaa: {key}, {year}")
          message = f"Varmistettu Turson takaisinluvulla: {len(stored)}/{len(batch)}. Muuttuneita rivejä: {result['affected_row_count']}."
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(message, file=summary)
          PY
